services:
  - type: web
    name: quotegen-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://voboepfogfarnmhieoxt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://quotegen1-ai.netlify.app
      - key: FRONTEND_URL
        value: https://quotegen1-ai.netlify.app
      - key: FLUTTERWAVE_MONTHLY_PRICE_NGN
        value: "13310"
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET_HASH
        sync: false
